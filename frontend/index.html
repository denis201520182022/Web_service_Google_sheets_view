<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <title>Zabota Tables</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/admin_users.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; 
            overflow: hidden;
        }

        /* === АВТОРИЗАЦИЯ === */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* === ВЫБОР ТАБЛИЦЫ === */
        #sheet-selector {
            display: none;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .selector-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .selector-box h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 24px;
        }

        /* === ГЛАВНЫЙ ИНТЕРФЕЙС === */
        #main-app {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: #f5f5f5;
        }
        /* Разрешаем ячейкам растягиваться под большой шрифт */
        .handsontable td {
            white-space: nowrap;
            line-height: normal !important;
            padding-top: 2px;
            padding-bottom: 2px;
        }
        .app-header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            /* Добавляем эти две строки для гибкости: */
            flex-wrap: wrap; 
            gap: 15px; /* Чуть увеличим отступ между элементами */
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            margin-right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-info {
            flex-grow: 1;
        }

        .file-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .sheet-tabs {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }

        .sheet-tab {
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sheet-tab:hover {
            background: rgba(255,255,255,0.3);
        }

        .sheet-tab.active {
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .save-status {
            font-size: 13px;
            margin-right: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
        }
        /* Добавить к стилям индикатора */
        .lock-indicator.success {
            background: #27ae60; /* Зеленый цвет */
        }
        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.3);
        }

        .toolbar {
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            align-items: center;
            /* Добавляем перенос: */
            flex-wrap: wrap;
            height: auto;
        }

        .tool-btn {
            padding: 8px 12px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #333;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Новые стили для форматирования */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            padding: 0;
            overflow: hidden;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        
        .tool-group {
            display: flex;
            gap: 2px;
            background: #f8f9fa;
            padding: 2px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .tool-btn .material-icons {
            font-size: 18px;
        }
        
        #sheet-dropdown {
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        #sheet-dropdown:hover {
            background: #e8eaed;
            color: #333;
        }
        
        #sheet-dropdown:focus {
            outline: 2px solid #667eea;
            background: white;
        }

        .separator {
            width: 1px;
            height: 24px;
            background: #e0e0e0;
            margin: 0 5px;
        }

        .formula-bar {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .fx-label {
            color: #666;
            font-weight: 600;
            margin-right: 12px;
            font-size: 14px;
        }

        .formula-input {
            flex-grow: 1;
            border: 1px solid #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            background: white;
        }

        .formula-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }
                /* Добавьте это в блок style */
        .locked-cell {
            background-color: #ffebee !important; /* Светло-красный фон */
            color: #c0392b !important;            /* Темно-красный текст */
        }

        #hot-container {
            flex-grow: 1;
            overflow: auto;
            background: white;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            min-height: 400px;
            height: calc(100vh - 200px);
        }

        .handsontable th {
            background: #f8f9fa !important;
            color: #666 !important;
            font-weight: 600 !important;
            font-size: 11px !important;
        }

        .handsontable td {
            font-size: 13px !important;
            border-color: #e8e8e8 !important;
        }

        .handsontable .wtBorder.current {
            background-color: #667eea !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinning {
            animation: spin 1s linear infinite;
        }
        
        /* Добавляем стили для истории таблиц */
        .sheet-history {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .sheet-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .sheet-item:hover {
            background: #e9ecef;
            border-color: #667eea;
        }
        
        .sheet-item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .sheet-item-meta {
            font-size: 12px;
            color: #666;
        }
        
        /* Стили для блокировок */
        .admin-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .lock-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #e74c3c;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        
        .lock-indicator.show {
            display: flex;
        }

        @media (max-width: 768px) {
            /* Скрываем текст кнопок, оставляем только иконки на узких экранах */
            .tool-btn span:not(.material-icons) {
                display: none;
            }
            
            /* Делаем заголовок компактнее */
            .logo {
                font-size: 18px;
                width: 100%; /* Логотип на всю ширину сверху */
                margin-bottom: 10px;
            }
            
            /* Кнопка выхода тоже компактная */
            .btn-logout {
                margin-left: auto; /* Прижимаем вправо */
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h1>🔐 Zabota Tables</h1>
            <p>Безопасный доступ к таблицам</p>
            
            <div class="input-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            
            <button class="btn-primary" onclick="login()">Войти</button>
            <div class="error-msg" id="login-error"></div>
        </div>
    </div>

    <!-- SHEET SELECTOR -->
    <div id="sheet-selector" style="display:none;">
        <div class="selector-box">
            <h2>Выберите таблицу</h2>
            
            <div class="input-group">
                <label>Ссылка на Таблицу</label>
                <input 
                    type="text" 
                    id="sheet-url" 
                    placeholder="">
            </div>
            
            <button class="btn-primary" onclick="setSheet()">Подключить</button>
            
            <div class="sheet-history" id="sheet-history"></div>
            
            <div class="error-msg" id="sheet-error"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" style="display:none;">
        <div class="app-header">
            <div class="logo">
                <span class="material-icons">table_chart</span>
                Zabota Tables
            </div>
            
            <div class="file-info">
                <div class="file-name" id="file-name">Загрузка...</div>
                
            </div>
            
            <div class="save-status" id="status-text">
                <span class="material-icons">cloud_done</span>
                <span>Сохранено</span>
            </div>
            
            
        </div>

        <div class="toolbar">
            <button class="tool-btn" onclick="refreshData()">
                <span class="material-icons">refresh</span>
                Обновить
            </button>
            <button class="tool-btn" onclick="downloadExcel()">
                <span class="material-icons">file_download</span>
                Excel
            </button>

            <!-- === НАЧАЛО НОВОГО БЛОКА === -->
            <div class="separator"></div>
            <!-- Группа шрифтов -->
            <div class="tool-group">
                <select class="tool-btn" id="font-family" onchange="applyStyle('font', this.value)" title="Шрифт">
                    <option value="Inter">Inter</option>
                    <option value="Arial">Arial</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Verdana">Verdana</option>
                </select>
                <select class="tool-btn" id="font-size" onchange="applyStyle('fontSize', this.value)" title="Размер шрифта">
                    <option value="12px">12</option>
                    <option value="14px">14</option>
                    <option value="16px">16</option>
                    <option value="18px">18</option>
                    <option value="20px">20</option>
                    <option value="24px">24</option>
                </select>
            </div>
            <div class="tool-group">
                <button class="tool-btn" onclick="applyStyle('bold')" title="Жирный">
                    <span class="material-icons">format_bold</span>
                </button>
                <button class="tool-btn" onclick="applyStyle('italic')" title="Курсив">
                    <span class="material-icons">format_italic</span>
                </button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" onclick="applyStyle('align', 'left')" title="По левому краю">
                    <span class="material-icons">format_align_left</span>
                </button>
                <button class="tool-btn" onclick="applyStyle('align', 'center')" title="По центру">
                    <span class="material-icons">format_align_center</span>
                </button>
                <button class="tool-btn" onclick="applyStyle('align', 'right')" title="По правому краю">
                    <span class="material-icons">format_align_right</span>
                </button>
            </div>

            <div class="tool-group" style="align-items: center; padding: 0 8px;">
                <label title="Цвет текста" style="cursor: pointer; display: flex;">
                    <span class="material-icons" style="font-size: 18px; color: #666; margin-right: 4px;">format_color_text</span>
                    <input type="color" id="text-color-picker" oninput="applyStyle('color', this.value)" value="#000000">
                </label>
            </div>
            
            <div class="tool-group" style="align-items: center; padding: 0 8px;">
                <label title="Цвет заливки" style="cursor: pointer; display: flex;">
                    <span class="material-icons" style="font-size: 18px; color: #666; margin-right: 4px;">format_color_fill</span>
                    <input type="color" id="bg-color-picker" oninput="applyStyle('bg', this.value)" value="#ffffff">
                </label>
            </div>
            <!-- === КОНЕЦ НОВОГО БЛОКА === -->

            <div class="separator"></div>
            
            <select id="sheet-dropdown" class="tool-btn" onchange="changeSheet()">
                <option value="">Выберите лист...</option>
            </select>
            
            <div id="admin-tools" style="display:none;">
                <div class="separator"></div>
                
                <button class="tool-btn" onclick="openUserManagement()">
                    <span class="material-icons">manage_accounts</span>
                    Пользователи
                </button>
                <button class="tool-btn" onclick="showLockDialog()">
                    <span class="material-icons">lock</span>
                    Блокировать диапазон
                </button>
                            <!-- НОВАЯ КНОПКА -->
                <button class="tool-btn" onclick="unlockSelectedRange()">
                    <span class="material-icons">lock_open</span>
                    Разблокировать диапазон
                </button>
            </div>
        </div>

        <div class="formula-bar">
            <span class="fx-label">fx</span>
            <input type="text" class="formula-input" id="formula-input" placeholder="Формула или значение">
        </div>

        <div id="hot-container"></div>
        
        <div class="lock-indicator" id="lock-indicator">
            <span class="material-icons">lock</span>
            <span>Эта ячейка заблокирована</span>
        </div>
    </div>

    <script>
        const API_URL = "";
        let token = null;
        let username = null;
        let isAdmin = false;
        let userFirstName = null;
        let userLastName = null;
        let userFullName = ""; // Будет "Иван Иванов"
        let hot = null;
        let cellStyles = {}; // Объект для хранения стилей: "row,col" -> {bold: true, color: "#ff0000", ...}
        let activeLocks = []; // Храним список блокировок здесь
        let cellValidations = {}; // "row,col" -> ["Вариант1", "Вариант2"]
        let currentSheet = null;
        let currentSpreadsheetId = null;
        let availableSheets = [];
        let formulasMap = {}; // Карта формул: "row,col" -> "=SUM(A1:A10)"
        
        let selectedCell = { row: null, col: null };
        let debounceTimer = null;
        let pendingUpdates = [];

        // === АВТОРИЗАЦИЯ ===
        // === АВТОРИЗАЦИЯ ===
        async function login() {
            const userInput = document.getElementById('username').value;
            const passInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');

            if (!userInput || !passInput) {
                errorMsg.textContent = 'Заполните все поля';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userInput, password: passInput })
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    username = data.username;
                    isAdmin = data.is_admin;
                    
                    // Сохраняем имя и фамилию
                    userFirstName = data.first_name || "";
                    userLastName = data.last_name || "";
                    userFullName = `${userFirstName} ${userLastName}`.trim();
                    
                    console.log(`✅ Вход выполнен: ${username} (admin=${isAdmin})`);
                    
                    // Если таблица уже была создана, обновляем её настройки под текущего юзера
                    if (hot) {
                        hot.updateSettings({}); 
                    }

                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('sheet-selector').style.display = 'flex';
                    
                    if (isAdmin) {
                        document.getElementById('admin-tools').style.display = 'flex';
                    }
                    
                    loadSheetHistory();
                } else {
                    errorMsg.textContent = 'Неверный логин или пароль';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                errorMsg.textContent = 'Ошибка сети';
                errorMsg.style.display = 'block';
            }
        }

        async function applyStyle(type, value = null) {
            const selection = hot.getSelected();
            if (!selection) return;

            // 1. ПРЕДВАРИТЕЛЬНАЯ ПРОВЕРКА (для обычных пользователей)
            if (!isAdmin) {
                for (let i = 0; i < selection.length; i++) {
                    const [r1, c1, r2, c2] = selection[i];
                    const startRow = Math.min(r1, r2);
                    const endRow = Math.max(r1, r2);
                    const startCol = Math.min(c1, c2);
                    const endCol = Math.max(c1, c2);

                    for (let r = startRow; r <= endRow; r++) {
                        for (let c = startCol; c <= endCol; c++) {
                            // Проверяем, заблокирована ли конкретная ячейка (r, c)
                            const isLocked = activeLocks.some(lock => 
                                lock.sheet_name === currentSheet && isCellInLock(r, c, lock.range)
                            );

                            if (isLocked) {
                                console.warn(`🚫 Попытка форматирования заблокированной ячейки [${r}, ${c}]`);
                                showLockIndicator(); // Показываем красную плашку
                                return; // ВАЖНО: Прерываем выполнение всей функции, ничего не красим!
                            }
                        }
                    }
                }
            }

            // 2. ЕСЛИ ПРОВЕРКА ПРОЙДЕНА (или юзер админ) — КРАСИМ
            const updates = [];
            for (let i = 0; i < selection.length; i++) {
                const [r1, c1, r2, c2] = selection[i];
                for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
                    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
                        const key = `${r},${c}`;
                        if (!cellStyles[key]) cellStyles[key] = {};

                        if (type === 'bold') cellStyles[key].bold = !cellStyles[key].bold;
                        else if (type === 'italic') cellStyles[key].italic = !cellStyles[key].italic;
                        else if (type === 'align') cellStyles[key].align = value;
                        else if (type === 'color') cellStyles[key].color = value;
                        else if (type === 'bg') cellStyles[key].bg = value;
                        else if (type === 'font') cellStyles[key].font = value;
                        else if (type === 'fontSize') cellStyles[key].fontSize = value;

                        updates.push({ row: r, col: c, style: cellStyles[key] });
                    }
                }
            }

            // Немедленно перерисовываем только если мы не прервались выше
            hot.render();

            // 3. ОТПРАВКА НА СЕРВЕР
            try {
                const response = await fetch(`${API_URL}/api/styles/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        spreadsheet_id: currentSpreadsheetId,
                        sheet_name: currentSheet,
                        styles: updates
                    })
                });

                if (!response.ok) {
                    if (response.status === 403) {
                        showLockIndicator();
                        // Если сервер все же отказал, обновляем данные, чтобы сбросить локальные изменения стиля
                        loadStyles(); 
                    }
                }
            } catch (e) {
                console.error("Ошибка сохранения стилей:", e);
            }
        }
        async function loadStyles() {
            if (!currentSpreadsheetId || !currentSheet) return;

            try {
                const response = await fetch(
                    `${API_URL}/api/styles?spreadsheet_id=${currentSpreadsheetId}&sheet_name=${encodeURIComponent(currentSheet)}`,
                    {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }
                );

                    // Очищаем старые стили перед загрузкой новых для этого листа
                    cellStyles = {};
                    
                    // Преобразуем массив от сервера в наш объект map
                    data.styles.forEach(item => {
                        const key = `${item.row},${item.col}`;
                        cellStyles[key] = item.style;
                    });

                    console.log(`🎨 Загружено стилей: ${data.styles.length}`);
                    if (hot) hot.render();
                }
            } catch (e) {
                console.error("Ошибка загрузки стилей:", e);
            }
        }

        // === ЗАГРУЗКА ИСТОРИИ ТАБЛИЦ ===

        // === ВЫБОР ТАБЛИЦЫ ===
        async function setSheet(directUrl = null) {
            // Если передали прямую ссылку (из истории), берем её. 
            // Если нет - берем из поля ввода.
            const url = directUrl || document.getElementById('sheet-url').value;
            const errorMsg = document.getElementById('sheet-error');

            if (!url) {
                errorMsg.textContent = 'Введите ссылку на таблицу';

            }

            try {
                const response = await fetch(`${API_URL}/api/set-sheet`, {

                        'Authorization': `Bearer ${token}`
                    },

                });

                if (response.ok) {
                    const data = await response.json();

        async function unlockSelectedRange() {
            const selection = hot.getSelected();
            if (!selection) {
                alert('Выберите заблокированную ячейку');
                return;
            }
            const [r1, c1] = selection[0];
            
            // Ищем блокировку
            const targetLock = activeLocks.find(lock => isCellInLock(r1, c1, lock.range));
            
            if (!targetLock) {
                alert('Эта ячейка не заблокирована или вы не попали в диапазон');
                return;
            }

            if (!confirm(`Снять блокировку с диапазона ${targetLock.range}?`)) return;

            try {
                const response = await fetch(`${API_URL}/api/admin/unlock-range/${targetLock.id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    // 1. Уведомление
                    showNotification(`✅ Диапазон ${targetLock.range} разблокирован`, 'success');
                    
                    // 2. Убираем из локального списка (чтобы глаз не резало, пока грузится)
                    activeLocks = activeLocks.filter(lock => lock.id !== targetLock.id);
                    hot.render();

                    // 3. ГЛАВНОЕ: Вызываем полную перезагрузку, как кнопка "Обновить"
                    refreshData();
                    
                } else {
                    showNotification('Ошибка при удалении', 'error');
                }
            } catch (e) {

                showNotification('Ошибка сети', 'error');

        // === ЗАГРУЗКА ДАННЫХ С ФОРМУЛАМИ ===
        async function loadData(sheetName = null, isBackgroundUpdate = false) {
            // Если это не фоновое обновление, показываем статус "Загрузка..."
            if (!isBackgroundUpdate) {
                setSaving('Загрузка...');
            }
            // === ДОБАВИТЬ ЭТУ СТРОКУ ===
            activeLocks = []; // Очищаем блокировки перед загрузкой нового листа
            // ==========================
            currentSheet = sheetName;
            pendingUpdates = [];
            clearTimeout(debounceTimer);

            // 1. Запоминаем позицию курсора перед обновлением
            const lastSelection = hot ? hot.getSelected() : null;

            try {
                const url = sheetName 
                    ? `${API_URL}/api/data?sheet_name=${encodeURIComponent(sheetName)}`
                    : `${API_URL}/api/data`;

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const json = await response.json();
                const tableData = json.data && json.data.length > 0 ? json.data : [['']];

                formulasMap = json.formulas || {};
                cellValidations = json.validations || {}; // СОХРАНЯЕМ СПИСКИ
                console.log('📥 Загружено формул:', Object.keys(formulasMap).length);
                
                if (hot) {
                    hot.loadData(tableData);
                    
                    // 2. Восстанавливаем курсор, если он был
                    if (lastSelection) {
                        // lastSelection = [[startRow, startCol, endRow, endCol]]
                        hot.selectCell(
                            lastSelection[0][0], 
                            lastSelection[0][1], 
                            lastSelection[0][2], 
                            lastSelection[0][3],
                            true // true = не прокручивать экран к ячейке (чтобы не дёргалось)
                        );
                    }
                    
                    hot.render();
                } else {
                    renderTable(tableData);
                }
                await loadStyles();
                setSaved();
                if (isAdmin) loadLocks();
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                setError();
                if (!hot) renderTable([['']]);
            }
        }

        // === РЕНДЕР ТАБЛИЦЫ ===
        function renderTable(data) {
            const container = document.getElementById('hot-container');
            const formulaInput = document.getElementById('formula-input');

            // Если таблица уже была создана, уничтожаем старый экземпляр (профилактика багов)
            if (hot) {
                hot.destroy();
            }

            hot = new Handsontable(container, {
                data: data,
                startRows: 100,
                startCols: 26,
                minSpareRows: 10,
                minSpareCols: 5,
                rowHeaders: true,
                colHeaders: true,
                licenseKey: 'non-commercial-and-evaluation',
                width: '100%',
                height: '100%',
                outsideClickDeselects: false,
                allowInvalid: false,
                
                cells: function(row, col) {
                    const cellProps = {};
                    const key = `${row},${col}`;
                    
                    // 1. ЛОГИКА ВЫПАДАЮЩИХ СПИСКОВ И ЗАЩИТЫ ИМЕН
                    if (cellValidations && cellValidations[key]) {
                        cellProps.type = 'dropdown';
                        const originalSource = cellValidations[key];

                        if (isAdmin) {
                            // Админ видит всех и может всё
                            cellProps.source = originalSource;
                            cellProps.readOnly = false;
                        } else {
                            // Обычный пользователь - берем значение прямо из массива data
                            const currentValue = (data[row] && data[row][col]) ? data[row][col] : "";

                            if (!currentValue || currentValue === "") {
                                cellProps.source = originalSource.filter(name => name === userFullName);
                                cellProps.readOnly = false;
                            } else if (currentValue === userFullName) {
                                cellProps.source = ["", userFullName];
                                cellProps.readOnly = false;
                            } else {
                                cellProps.source = [currentValue];
                                cellProps.readOnly = true; 
                            }
                        }
                    }

                    // 2. БЛОКИРОВКИ АДМИНИСТРАТОРА (Только для не-админов!)
                    if (!isAdmin && activeLocks && activeLocks.length > 0) {
                        for (let lock of activeLocks) {
                            if (lock.sheet_name !== currentSheet) continue;
                            if (isCellInLock(row, col, lock.range)) {
                                cellProps.className = 'locked-cell'; 
                                cellProps.readOnly = true;
                                break; 
                            }
                        }
                    }

                    // 3. РЕНДЕРЕР (Визуал)
                    cellProps.renderer = function(instance, td, row, col, prop, value, cellProperties) {
                        const baseRenderer = Handsontable.renderers.getRenderer(cellProperties.type || 'text');
                        baseRenderer.apply(this, arguments);
                        
                        // Серый фон для ячеек, которые заняты другими (только для юзеров)
                        if (!isAdmin && cellProperties.readOnly && !cellProperties.className?.includes('locked-cell')) {
                            td.style.backgroundColor = '#f3f3f3';
                            td.style.color = '#999';
                        }

                        const sKey = `${row},${col}`;
                        const style = cellStyles[sKey];
                        
                        if (style) {
                            if (style.bold) td.style.fontWeight = 'bold';
                            if (style.italic) td.style.fontStyle = 'italic';
                            if (style.align) td.style.textAlign = style.align;
                            if (style.color) td.style.color = style.color;
                            if (style.bg) td.style.backgroundColor = style.bg;
                            if (style.font) td.style.setProperty('font-family', style.font, 'important');
                            if (style.fontSize) td.style.setProperty('font-size', style.fontSize, 'important');
                        }

                        if (cellProperties.className === 'locked-cell') {
                            td.classList.add('locked-cell');
                        }
                    };

                    return cellProps;
                },
                manualColumnResize: true,
                manualRowResize: true,
                contextMenu: true,
                
                afterSelection: (r, c) => {
                    selectedCell.row = r;
                    selectedCell.col = c;
                    const formulaKey = `${r},${c}`;
                    if (formulasMap[formulaKey]) {
                        formulaInput.value = formulasMap[formulaKey];
                    } else {
                        const val = hot.getDataAtCell(r, c);
                        formulaInput.value = val === null ? '' : val;
                    }
                },
                
                afterChange: function(changes, source) {
                    if (source === 'loadData' || source === 'revert_lock') return;
                    
                    if (changes) {
                        setSaving('Ввод...');
                        changes.forEach(([row, prop, oldValue, newValue]) => {
                            if (oldValue !== newValue) {
                                const formulaKey = `${row},${prop}`;
                                if (newValue && newValue.toString().startsWith('=')) {
                                    formulasMap[formulaKey] = newValue.toString();
                                } else if (formulasMap[formulaKey]) {
                                    delete formulasMap[formulaKey];
                                }
                                
                                pendingUpdates.push({
                                    row: row,
                                    col: prop,
                                    oldValue: oldValue,
                                    newValue: newValue === null ? "" : newValue.toString()
                                });
                            }
                        });

                        if (debounceTimer) clearTimeout(debounceTimer);
                        debounceTimer = setTimeout(() => {
                            if (pendingUpdates.length > 0) {
                                sendBatch([...pendingUpdates]);
                                pendingUpdates = [];
                            }
                        }, 1000);
                    }
                }
            });

            formulaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && selectedCell.row !== null && selectedCell.col !== null) {
                    const newValue = formulaInput.value;
                    hot.setDataAtCell(selectedCell.row, selectedCell.col, newValue);
                }
            });

            setTimeout(() => {
                if (hot) hot.render();
            }, 100);
        }

        // === ОТПРАВКА ИЗМЕНЕНИЙ ===
        async function sendBatch(updates) {
            setSaving('Сохранение...');
            
            try {
                const url = currentSheet
                    ? `${API_URL}/api/batch-update?sheet_name=${encodeURIComponent(currentSheet)}`
                    : `${API_URL}/api/batch-update`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ updates: updates })
                });

                if (response.ok) {
                    console.log(`✅ Сохранено ${updates.length} изменений`);
                    
                    // === МАГИЯ ЗДЕСЬ ===
                    // Сразу после сохранения тихо подтягиваем актуальные данные (результаты формул)
                    await loadData(currentSheet, true); 
                    
                } 
                else if (response.status === 403) {
                    const error = await response.json();
                    showLockIndicator();
                    setError();
                    
                    // Откат изменений при ошибке блокировки
                    updates.forEach(item => {
                        hot.setDataAtCell(item.row, item.col, item.oldValue, 'revert_lock');
                    });
                } 
                else {
                    setError();
                    console.error('Server error:', await response.text());
                }
            } catch (error) {
                setError();
                console.error('Network error:', error);
            }
        }
        
        // Парсит "A1" или "B2" в {row, col}
        function parseCell(cellStr) {
            const match = cellStr.match(/([A-Z]+)([0-9]+)/);
            if (!match) return null;
            
            const colStr = match[1];
            const rowStr = match[2];
            
            let col = 0;
            for (let i = 0; i < colStr.length; i++) {
                col = col * 26 + (colStr.charCodeAt(i) - 64);
            }
            
            return {
                row: parseInt(rowStr) - 1,
                col: col - 1
            };
        }

        // Проверяет, находится ли ячейка (r, c) внутри диапазона "A1:B2"
        function isCellInLock(r, c, rangeStr) {
            const parts = rangeStr.split(':');
            const start = parseCell(parts[0]);
            const end = parts.length > 1 ? parseCell(parts[1]) : start;
            
            if (!start || !end) return false;
            
            return r >= start.row && r <= end.row && 
                c >= start.col && c <= end.col;
        }

        async function loadLocks() {
            if (!isAdmin || !currentSpreadsheetId) return;

            try {
                const url = `${API_URL}/api/admin/locked-ranges?spreadsheet_id=${currentSpreadsheetId}&sheet_name=${currentSheet}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    activeLocks = data.locks; // Обновляем массив
                    
                    // ПРИНУДИТЕЛЬНАЯ ПЕРЕРИСОВКА
                    if (hot) {
                        hot.render(); 
                    }
                    console.log('🔒 Блокировки обновлены:', activeLocks.length);
                }
            } catch (e) {
                console.error('Ошибка загрузки блокировок', e);
            }
        }

        // === ИНДИКАТОР БЛОКИРОВКИ ===
        // Универсальная функция уведомлений
        function showNotification(text, type = 'error') {
            const indicator = document.getElementById('lock-indicator');
            const span = indicator.querySelector('span:last-child');
            const icon = indicator.querySelector('.material-icons');
            
            span.textContent = text;
            
            // Сброс классов
            indicator.className = 'lock-indicator';
            
            if (type === 'success') {
                indicator.classList.add('success');
                icon.textContent = 'check_circle'; // Иконка галочки
            } else {
                // error
                icon.textContent = 'lock'; // Иконка замка
            }
            
            indicator.classList.add('show');
            
            // Скрываем через 3 секунды
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 3000);
        }

        // Старая функция теперь просто вызывает новую (для совместимости)
        function showLockIndicator() {
            showNotification('Эта ячейка заблокирована', 'error');
        }
        // Функция для конвертации индекса колонки в букву (0 -> A, 26 -> AA)
        function getColumnLabel(index) {
            let label = '';
            while (index >= 0) {
                label = String.fromCharCode(65 + (index % 26)) + label;
                index = Math.floor(index / 26) - 1;
            }
            return label;
        }
        // === БЛОКИРОВКА ДИАПАЗОНА (для админа) ===
        function showLockDialog() {
            // 1. Получаем выделение из таблицы
            const selection = hot.getSelected();
            
            if (!selection || selection.length === 0) {
                alert('Сначала выделите ячейки, которые хотите заблокировать!');
                return;
            }

            // selection[0] возвращает массив: [startRow, startCol, endRow, endCol]
            // Handsontable может возвращать координаты в обратном порядке (если выделяли снизу вверх),
            // поэтому используем Math.min и Math.max для нормализации.
            const [r1, c1, r2, c2] = selection[0];
            
            const startRow = Math.min(r1, r2);
            const endRow = Math.max(r1, r2);
            const startCol = Math.min(c1, c2);
            const endCol = Math.max(c1, c2);

            // 2. Генерируем нотацию A1:B2
            const startLabel = `${getColumnLabel(startCol)}${startRow + 1}`;
            const endLabel = `${getColumnLabel(endCol)}${endRow + 1}`;
            
            // Если выделена одна ячейка, будет просто "A1", если диапазон - "A1:B2"
            const rangeNotation = (startLabel === endLabel) 
                ? startLabel 
                : `${startLabel}:${endLabel}`;

            // 3. Спрашиваем только причину
            const reason = prompt(`Блокировка диапазона: ${rangeNotation}\n\nУкажите причину (необязательно):`);
            
            // Если нажали "Отмена" (null), ничего не делаем
            if (reason === null) return;
            
            // 4. Вызываем функцию блокировки
            lockRange(rangeNotation, reason);
        }

        async function lockRange(range, reason) {
            try {
                const response = await fetch(`${API_URL}/api/admin/lock-range`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        spreadsheet_id: currentSpreadsheetId,
                        sheet_name: currentSheet,
                        range_notation: range,
                        reason: reason
                    })
                });
                
                if (response.ok) {
                    // === ИЗМЕНЕНИЕ: Красивое уведомление вместо alert ===
                    showNotification(`✅ Диапазон ${range} заблокирован`, 'success');
                    
                    // Обновляем список, чтобы ячейки покраснели
                    await loadLocks(); 
                } else {
                    const error = await response.json();
                    showNotification(`❌ ${error.detail}`, 'error'); // Используем красный тост для ошибки
                }
            } catch (error) {
                showNotification('Ошибка блокировки', 'error');
                console.error(error);
            }
        }

        // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
        function renderSheetTabs() {
            const selector = document.getElementById('sheet-dropdown');
            
            // Очищаем и добавляем дефолтную опцию (если нужно, или сразу первый лист)
            selector.innerHTML = ''; 
            
            availableSheets.forEach((sheetName, idx) => {
                const option = document.createElement('option');
                option.value = sheetName;
                option.textContent = sheetName;
                
                // Если это первый лист - выбираем его
                if (idx === 0) option.selected = true;
                
                selector.appendChild(option);
            });
        }

        async function selectSheet(sheetName) {
            try {
                await fetch(`${API_URL}/api/select-sheet`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ sheet_name: sheetName })
                });
                
                loadData(sheetName);
                
                
                document.getElementById('sheet-dropdown').value = sheetName;
            } catch (error) {
                console.error(error);
            }
        }
        
        function changeSheet() {
            const selector = document.getElementById('sheet-dropdown');
            const sheetName = selector.value;
            if (sheetName) selectSheet(sheetName);
        }

        async function refreshData() {
            setSaving('Обновление...');
            
            try {
                // 1. Запрашиваем актуальный список листов
                const response = await fetch(`${API_URL}/api/sheets`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    availableSheets = data.sheets;
                    
                    // Запоминаем текущий выбранный лист, чтобы он не слетел
                    const currentSelection = document.getElementById('sheet-dropdown').value;
                    
                    // Перерисовываем выпадающий список
                    renderSheetTabs();
                    
                    // Если текущий лист все еще существует, выбираем его обратно
                    if (availableSheets.includes(currentSelection)) {
                        document.getElementById('sheet-dropdown').value = currentSelection;
                    } else {
                        // Если лист удалили в оригинале, переключаемся на первый
                        document.getElementById('sheet-dropdown').value = availableSheets[0];
                        currentSheet = availableSheets[0];
                    }
                }
            } catch (e) {
                console.error("Не удалось обновить список листов", e);
            }

            // 2. Загружаем данные (ячейки)
            loadData(currentSheet);
        }

        function logout() {
            console.log('👋 Выход из системы');
            token = null;
            username = null;
            isAdmin = false;
            hot = null;
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function setSaving(text) {
            document.getElementById('status-text').innerHTML = 
                `<span class="material-icons spinning">sync</span><span>${text}</span>`;
        }

        function setSaved() {
            document.getElementById('status-text').innerHTML = 
                '<span class="material-icons">cloud_done</span><span>Сохранено</span>';
        }

        function setError() {
            document.getElementById('status-text').innerHTML = 
                '<span class="material-icons" style="color:#e74c3c">error</span><span>Ошибка</span>';
        }

        function downloadExcel() {
            if (!hot) return;
            const data = hot.getData();
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            const fileName = (document.getElementById('file-name').textContent || 'Table').trim();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `${fileName}.xlsx`);
            console.log(`💾 Экспорт в Excel: ${fileName}.xlsx`);
        }

        document.getElementById('password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        
        document.getElementById('sheet-url')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setSheet();
        });
    </script>
    <div id="user-modal-container"></div>

    <script src="/static/admin_users.js"></script>
</body>
</html>
